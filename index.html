<!doctype html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASA Astronomy Pictures</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <div id="app"></div>

    <header>

      </div>
    </header>

    <p>(pictures and info from https://api.nasa.gov/ through the API)</p>
    <footer>

    <style>
      header {
      background-color: #0c1f5c;
      height: 60px;
      display: flex;

      padding: 10px;
      }

        background-color: #0e1f55;
        height: 40px;

      }

        color: rgb(169, 209, 222);

        letter-spacing: 0.6px;

        color: rgb(195, 213, 231);
        background-image: url('https://static.vecteezy.com/system/resources/thumbnails/017/185/942/small/watercolor-brush-grunge-abstract-background-free-photo.jpg');

      #app {
        margin-top: 20px;
        font-size: 18px;
